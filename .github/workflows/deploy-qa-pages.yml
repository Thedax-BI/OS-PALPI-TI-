name: Deploy QA Pages

on:
  push:
    branches:
      - qa

permissions:
  contents: read

concurrency:
  group: qa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      QA_PAGES_TOKEN: ${{ secrets.QA_PAGES_TOKEN }}
      QA_REPOSITORY: Iguinhowill/OS-PALPI-TI-QA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static artifact
        run: |
          mkdir -p _site
          cp index.html dashboard.html admin.html palpiti.css palpiti.js formulario.js admin.js theme.js _site/
          touch _site/.nojekyll

      - name: Skip deploy without token
        if: env.QA_PAGES_TOKEN == ''
        run: |
          echo "QA_PAGES_TOKEN is not configured. Static artifact was prepared, but deploy was skipped."

      - name: Deploy to QA repository
        if: env.QA_PAGES_TOKEN != ''
        run: |
          git clone "https://x-access-token:${QA_PAGES_TOKEN}@github.com/${QA_REPOSITORY}.git" qa-pages
          find qa-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R _site/. qa-pages/
          cd qa-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "deploy: publica qa estatico"
          git push origin main
