<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Palpites - Formulário</title>
  <link rel="stylesheet" href="palpiti.css" />
  <script src="theme.js" defer></script>
  <script src="formulario.js" defer></script>
</head>
<body class="form-page">
  <div class="wrap form-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">OS PALPI-TI</p>
        <h1>Palpites de Futebol</h1>
        <p class="subtitle">Lance um palpite manualmente ou escolha um jogo já cadastrado.</p>
      </div>

      <nav class="top-actions" aria-label="Navegação">
        <a class="btn ghost nav-btn" href="dashboard.html">Dashboard</a>
        <a class="btn ghost nav-btn" href="admin.html">Admin</a>
        <button class="btn ghost icon-btn theme-toggle" id="themeToggle" type="button">Tema</button>
      </nav>
    </header>

    <main class="form-layout">
      <section class="card suggestionsPanel" aria-labelledby="suggestionsTitle">
        <div class="sectionHeader">
          <div>
            <p class="eyebrow">Agenda</p>
            <h2 id="suggestionsTitle">Jogos sugeridos</h2>
          </div>
          <button class="btn ghost compact" id="btnReloadSuggestions" type="button">Atualizar</button>
        </div>

        <label class="sr-only" for="suggestionSearch">Buscar sugestão</label>
        <input id="suggestionSearch" type="search" placeholder="Buscar por time ou competição" autocomplete="off" />

        <div id="suggestionsStatus" class="state-text">Carregando sugestões...</div>
        <div id="suggestionsList" class="suggestionsList"></div>
      </section>

      <section class="card form-card" aria-labelledby="formTitle">
        <div class="sectionHeader">
          <div>
            <p class="eyebrow">Lançamento</p>
            <h2 id="formTitle">Novo registro</h2>
          </div>
        </div>

        <form id="form" novalidate>
          <div class="grid">
            <div class="field col6">
              <label for="nome">Nome</label>
              <select id="nome" name="nome" required>
                <option value="" selected disabled>Selecione...</option>
                <option>Resultado</option>
                <option>Igor Florense</option>
                <option>Enzo Rodrigues</option>
                <option>Lucas Silva</option>
                <option>Jessé Diniz</option>
                <option>Sérgio Da Silva</option>
                <option>Diego Gavioli</option>
                <option>Matheus Luz</option>
              </select>
            </div>

            <div class="field col6">
              <label for="dataJogo">Data do jogo</label>
              <input id="dataJogo" name="dataJogo" type="date" required />
            </div>

            <div class="field col6">
              <label for="competicao">Competição</label>
              <select id="competicao" name="competicao" required>
                <option value="" selected disabled>Carregando...</option>
              </select>
            </div>

            <div class="field col6">
              <span class="labelText">Tipo de lançamento</span>
              <div class="radios" role="radiogroup" aria-label="Tipo de lançamento">
                <label class="radio">
                  <input type="radio" name="tipoLancamento" value="resultado" required />
                  Resultado
                </label>
                <label class="radio">
                  <input type="radio" name="tipoLancamento" value="palpite" required />
                  Palpite
                </label>
              </div>
            </div>

            <div class="row-match">
              <div class="field">
                <label for="mandante">Mandante</label>
                <div class="teamLine">
                  <input
                    class="golsMini"
                    id="golsMandante"
                    name="golsMandante"
                    type="number"
                    min="0"
                    max="30"
                    step="1"
                    placeholder="0"
                    inputmode="numeric"
                    required
                  />
                  <select class="teamSelect" id="mandante" name="mandante" required disabled>
                    <option value="" selected disabled>Selecione o time...</option>
                  </select>
                </div>
              </div>

              <div class="x">X</div>

              <div class="field">
                <label for="visitante">Visitante</label>
                <div class="teamLine">
                  <input
                    class="golsMini"
                    id="golsVisitante"
                    name="golsVisitante"
                    type="number"
                    min="0"
                    max="30"
                    step="1"
                    placeholder="0"
                    inputmode="numeric"
                    required
                  />
                  <select class="teamSelect" id="visitante" name="visitante" required disabled>
                    <option value="" selected disabled>Selecione o time...</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="actions">
            <div class="hint" id="hint">Carregando competições e times.</div>
            <div class="form-actions">
              <button class="btn ghost" id="btnRefresh" type="button">Limpar</button>
              <button class="btn" id="btnEnviar" type="submit" disabled>Enviar</button>
            </div>
          </div>

          <div id="msg" class="msg" aria-live="polite"></div>
          <pre id="preview"></pre>
        </form>
      </section>
    </main>
  </div>

  <iframe name="gas_iframe" hidden></iframe>
</body>
</html>
